<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #0F7C90; text-decoration: none; }
    a:hover { color: #0B5F70; }
    .lilo { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; }
  </style>
</helmet>
<div class="lilo" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; color: #000000; -webkit-font-smoothing: antialiased;">

  <div style="position: absolute; left: 20px; top: 60px;">
    <img src="lilo-mark.png" alt="Lilo" style="height: 52px; width: auto; display: block;">
    <div style="font-size: 19px; font-weight: 600; margin-top: 12px;">Upcoming holidays</div>
  </div>

  <div style="position: absolute; right: 20px; top: 60px; height: 44px; padding: 0 16px; border-radius: 999px; background: rgba(255,255,255,.7); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); box-shadow: 0 0 0 .5px rgba(60,60,67,.12), 0 4px 14px rgba(0,0,0,.08); display: flex; align-items: center; gap: 14px;">
    <div style="position: relative; display: flex; align-items: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 10-12 0c0 6-2 7.5-2 7.5h16s-2-1.5-2-7.5z"/><path d="M13.7 20a2 2 0 01-3.4 0"/></svg>
      <span style="position: absolute; top: -3px; right: -4px; width: 9px; height: 9px; border-radius: 999px; background: #FF3B30; border: 1.5px solid #FFFFFF;"></span>
    </div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.7"><circle cx="12" cy="12" r="9.2"/><circle cx="12" cy="9.6" r="3"/><path d="M5.9 19a6.6 6.6 0 0112.2 0"/></svg>
  </div>

  <div style="position: absolute; left: 20px; top: 158px; display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: rgba(116,116,128,.09);">
    <div style="height: 32px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.12); display: flex; align-items: center; font-size: 14px; font-weight: 600;">Holidays</div>
    <div style="height: 32px; padding: 0 18px; border-radius: 999px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: rgba(60,60,67,.6);">Memories</div>
  </div>

  <div style="position: absolute; left: 20px; top: 206px; width: 350px; height: 437px; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 .5px rgba(60,60,67,.12), 0 6px 20px rgba(0,0,0,.1);">
    <img src="amalfi.jpg" alt="Amalfi Coast" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 46%; display: block;">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 220px; background: linear-gradient(to top, rgba(0,0,0,.62), rgba(0,0,0,0));"></div>

    <div style="position: absolute; top: 14px; left: 14px; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.22); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: #FFFFFF; font-size: 11px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; display: flex; align-items: center;">In 12 days</div>
    <div style="position: absolute; top: 14px; right: 14px; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(255,159,10,.92); color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px;">
      <span style="width: 5px; height: 5px; border-radius: 999px; background: #FFFFFF;"></span>3 need you
    </div>

    <div style="position: absolute; left: 16px; right: 16px; bottom: 16px;">
      <div style="font-size: 28px; font-weight: 700; color: #FFFFFF; letter-spacing: -.2px; text-shadow: 0 2px 6px rgba(0,0,0,.3);">Amalfi Coast</div>
      <div style="display: flex; align-items: center; gap: 6px; margin-top: 4px; color: rgba(255,255,255,.92);">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 00-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 00-7-7z"/></svg>
        <span style="font-size: 14px; font-weight: 500;">Positano &middot; 24th - 31st August</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; margin-top: 14px;">
        <div style="display: flex;">
          <div style="width: 30px; height: 30px; border-radius: 999px; background: #B9BEC4; border: 2px solid rgba(255,255,255,.95); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: #FFFFFF;">A</div>
          <div style="width: 30px; height: 30px; border-radius: 999px; background: #A9AFB6; border: 2px solid rgba(255,255,255,.95); margin-left: -9px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: #FFFFFF;">S</div>
          <div style="width: 30px; height: 30px; border-radius: 999px; background: #BCC1C7; border: 2px solid rgba(255,255,255,.95); margin-left: -9px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: #FFFFFF;">J</div>
          <div style="width: 30px; height: 30px; border-radius: 999px; background: #C7CCD1; border: 2px solid rgba(255,255,255,.95); margin-left: -9px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: #FFFFFF;">M</div>
        </div>
        <div style="flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,.28);"><div style="width: 68%; height: 4px; border-radius: 999px; background: #FFFFFF;"></div></div>
        <span style="font-size: 12px; font-weight: 600; color: #FFFFFF;">68%</span>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 20px; top: 659px; width: 350px; height: 437px; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 .5px rgba(60,60,67,.12), 0 6px 20px rgba(0,0,0,.1);">
    <img src="positano.jpg" alt="Lisbon long weekend" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; filter: saturate(.82) hue-rotate(-12deg);">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 200px; background: linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0));"></div>
    <div style="position: absolute; top: 14px; left: 14px; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.22); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: #FFFFFF; font-size: 11px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; display: flex; align-items: center;">In 7 weeks</div>
    <div style="position: absolute; left: 16px; right: 16px; bottom: 16px;">
      <div style="font-size: 28px; font-weight: 700; color: #FFFFFF; letter-spacing: -.2px; text-shadow: 0 2px 6px rgba(0,0,0,.3);">Lisbon long weekend</div>
      <div style="display: flex; align-items: center; gap: 6px; margin-top: 4px; color: rgba(255,255,255,.92);">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 00-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 00-7-7z"/></svg>
        <span style="font-size: 14px; font-weight: 500;">Lisbon &middot; 3rd - 6th October</span>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: linear-gradient(to top, #FFFFFF 42%, rgba(255,255,255,0));"></div>

  <div style="position: absolute; right: 20px; bottom: 12px; height: 56px; padding: 0 22px; border-radius: 999px; background: rgba(255,255,255,.7); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 0 0 .5px rgba(60,60,67,.12), 0 6px 20px rgba(0,0,0,.14); display: flex; align-items: center; gap: 9px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span style="font-size: 17px; font-weight: 600;">New trip</span>
  </div>

</div>
</x-dc>
</body>
</html>
