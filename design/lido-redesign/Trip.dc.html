<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #0E7A70; text-decoration: none; }
    a:hover { color: #0A5A53; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F0E8; font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif; color: #16211E; -webkit-font-smoothing: antialiased;">

  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 412px;">
    <svg viewBox="0 0 390 412" width="390" height="412" style="display: block;" aria-hidden="true">
      <defs>
        <linearGradient id="tSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F9D9A4"/>
          <stop offset="0.44" stop-color="#F6C08F"/>
          <stop offset="1" stop-color="#ED9C80"/>
        </linearGradient>
        <radialGradient id="tSunGlow" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#FFEBBC" stop-opacity="0.95"/>
          <stop offset="0.55" stop-color="#FFC98A" stop-opacity="0.42"/>
          <stop offset="1" stop-color="#FFBE80" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="tSea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2F8F87"/>
          <stop offset="1" stop-color="#0B5C54"/>
        </linearGradient>
        <linearGradient id="tScrim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0A1E1C" stop-opacity="0"/>
          <stop offset="0.5" stop-color="#0A1E1C" stop-opacity="0.26"/>
          <stop offset="1" stop-color="#0A1E1C" stop-opacity="0.6"/>
        </linearGradient>
        <linearGradient id="tTopScrim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3A1E12" stop-opacity="0.24"/>
          <stop offset="1" stop-color="#3A1E12" stop-opacity="0"/>
        </linearGradient>
        <filter id="tGrain">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
          <feColorMatrix type="saturate" values="0"/>
        </filter>
      </defs>

      <rect width="390" height="412" fill="url(#tSky)"/>
      <circle cx="108" cy="118" r="140" fill="url(#tSunGlow)"/>
      <circle cx="108" cy="118" r="36" fill="#FFF1CE" opacity="0.96"/>
      <ellipse cx="270" cy="146" rx="150" ry="24" fill="#FBDDB4" opacity="0.48"/>
      <ellipse cx="90" cy="188" rx="160" ry="18" fill="#FBD3AE" opacity="0.42"/>

      <rect y="228" width="390" height="184" fill="url(#tSea)"/>
      <path d="M0 228 C 74 222, 132 234, 204 228 C 268 223, 322 233, 390 226 L390 240 L0 240 Z" fill="#54ABA0" opacity="0.5"/>

        <rect x="150" y="300" width="82" height="2.5" rx="1.2"/>
        <rect x="264" y="288" width="44" height="2.5" rx="1.2"/>
        <rect x="86" y="332" width="90" height="2.5" rx="1.2"/>
        <rect x="240" y="348" width="70" height="2.5" rx="1.2"/>
      </g>

      <path d="M390 212 C 336 178, 276 168, 226 202 C 192 224, 176 260, 168 300 C 161 336, 158 376, 158 412 L390 412 Z" fill="#0E6D63"/>
      <path d="M390 244 C 344 216, 300 210, 262 240 C 234 262, 222 296, 216 334 C 211 366, 209 392, 209 412 L390 412 Z" fill="#0A4A44"/>
      <g fill="#F7E3C4" opacity="0.92">
        <rect x="330" y="272" width="18" height="14" rx="2"/>
        <rect x="300" y="288" width="15" height="12" rx="2"/>
        <rect x="342" y="306" width="21" height="15" rx="2"/>
        <rect x="296" y="322" width="16" height="12" rx="2"/>
        <rect x="326" y="342" width="19" height="14" rx="2"/>
        <rect x="262" y="308" width="14" height="11" rx="2"/>
        <rect x="272" y="352" width="18" height="13" rx="2"/>
        <rect x="316" y="378" width="17" height="13" rx="2"/>

      <g fill="#D9743F" opacity="0.85">
        <rect x="328" y="268" width="22" height="4" rx="2"/>
        <rect x="298" y="284" width="19" height="4" rx="2"/>
        <rect x="340" y="302" width="25" height="4" rx="2"/>
        <rect x="294" y="318" width="20" height="4" rx="2"/>
        <rect x="324" y="338" width="23" height="4" rx="2"/>
        <rect x="260" y="304" width="18" height="4" rx="2"/>
        <rect x="270" y="348" width="22" height="4" rx="2"/>
        <rect x="314" y="374" width="21" height="4" rx="2"/>
      </g>
      <path d="M0 300 C 38 292, 66 314, 84 348 C 96 370, 102 392, 104 412 L0 412 Z" fill="#0C3F3B" opacity="0.88"/>

      <rect width="390" height="138" fill="url(#tTopScrim)"/>
      <rect width="390" height="412" filter="url(#tGrain)" opacity="0.055" style="mix-blend-mode: overlay;"/>
    </svg>
  </div>

  <div style="position: absolute; left: 16px; top: 56px; display: flex; align-items: center; justify-content: space-between; width: 358px;">
    <div style="width: 44px; height: 44px; border-radius: 999px; background: linear-gradient(150deg, rgba(255,255,255,.34), rgba(255,255,255,.16)); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); border: 0.5px solid rgba(255,255,255,.5); box-shadow: inset 0 1px 0.5px rgba(255,255,255,.66), 0 8px 22px rgba(10,30,28,.20); display: flex; align-items: center; justify-content: center; color: #FFFFFF;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 4px; height: 44px; padding: 4px; border-radius: 999px; background: linear-gradient(150deg, rgba(255,255,255,.34), rgba(255,255,255,.16)); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); border: 0.5px solid rgba(255,255,255,.5); box-shadow: inset 0 1px 0.5px rgba(255,255,255,.66), 0 8px 22px rgba(10,30,28,.20);">
      <div style="width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #FFFFFF;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12.5V19a1.5 1.5 0 001.5 1.5h8a1.5 1.5 0 001.5-1.5v-6.5"/><path d="M12 3.5v11"/><path d="M8.5 7L12 3.5 15.5 7"/></svg>
      </div>
      <div style="width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #FFFFFF;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 20px; top: 210px; width: 350px;">
    <div style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: linear-gradient(150deg, rgba(255,255,255,.30), rgba(255,255,255,.14)); backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%); border: 0.5px solid rgba(255,255,255,.46); box-shadow: inset 0 1px 0.5px rgba(255,255,255,.6); color: #FFFFFF; font-size: 12.5px; font-weight: 700;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
      In 12 days
    </div>
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 42px; line-height: 1.02; color: #FFFFFF; margin-top: 11px; text-shadow: 0 2px 18px rgba(8,26,24,.34);">Amalfi Coast</div>
    <div style="font-size: 13.5px; color: rgba(255,255,255,.86); margin-top: 6px; text-shadow: 0 1px 10px rgba(8,26,24,.4);">Positano, Italy</div>
    <div style="display: flex; align-items: center; gap: 9px; margin-top: 12px;">
      <div style="display: flex;">
        <div style="width: 28px; height: 28px; border-radius: 999px; background: #CFE5DF; border: 1.5px solid rgba(255,255,255,.85); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0B5D55;">A</div>
        <div style="width: 28px; height: 28px; border-radius: 999px; background: #F3D6C9; border: 1.5px solid rgba(255,255,255,.85); margin-left: -9px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #B54E2B;">S</div>
        <div style="width: 28px; height: 28px; border-radius: 999px; background: #EEDCBA; border: 1.5px solid rgba(255,255,255,.85); margin-left: -9px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #9C6A14;">J</div>
        <div style="width: 28px; height: 28px; border-radius: 999px; background: rgba(255,255,255,.34); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1.5px solid rgba(255,255,255,.85); margin-left: -9px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #FFFFFF;">+1</div>
      </div>
      <span style="font-size: 12.5px; font-weight: 700; color: #FFFFFF; text-shadow: 0 1px 8px rgba(8,26,24,.4);">4 going</span>
    </div>
  </div>

  <div style="position: absolute; left: 14px; top: 366px; width: 362px; border-radius: 32px; padding: 14px; background: linear-gradient(150deg, rgba(255,255,255,.74), rgba(255,255,255,.5)); backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%); border: 0.5px solid rgba(255,255,255,.82); box-shadow: inset 0 1px 0.5px rgba(255,255,255,.95), inset 0 -0.5px 0 rgba(255,255,255,.45), 0 16px 42px rgba(16,34,30,.18), 0 2px 6px rgba(16,34,30,.07);">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 999px; background: rgba(255,255,255,.6); border: 0.5px solid rgba(255,255,255,.75); box-shadow: inset 0 1px 0.5px rgba(255,255,255,.9);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E7A70" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
        <span style="font-size: 12.5px; font-weight: 700;">24 &ndash; 31 Aug</span>
        <span style="font-size: 12.5px; color: #8B968F;">7 nights</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 999px; background: rgba(255,255,255,.6); border: 0.5px solid rgba(255,255,255,.75); box-shadow: inset 0 1px 0.5px rgba(255,255,255,.9);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#E0A33C" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
        <span style="font-size: 12.5px; font-weight: 700;">28&deg;</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px;">
      <div style="height: 66px; border-radius: 20px; background: linear-gradient(160deg, #17847A, #0C6259); color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: inset 0 1px 0.5px rgba(255,255,255,.4), 0 4px 12px rgba(12,98,89,.3);">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8.5" r="3.6"/><path d="M4 19.5c0-3.2 2.7-5.2 6-5.2 1.3 0 2.5.3 3.5.9"/><path d="M18 14v6M15 17h6"/></svg>
        <span style="font-size: 11.5px; font-weight: 700;">Invite</span>
      </div>
      <div style="height: 66px; border-radius: 20px; background: rgba(255,255,255,.58); border: 0.5px solid rgba(255,255,255,.75); box-shadow: inset 0 1px 0.5px rgba(255,255,255,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16211E" stroke-width="1.9" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
        <span style="font-size: 11.5px; font-weight: 700;">Add</span>
      </div>
      <div style="height: 66px; border-radius: 20px; background: rgba(255,255,255,.58); border: 0.5px solid rgba(255,255,255,.75); box-shadow: inset 0 1px 0.5px rgba(255,255,255,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16211E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L20 4l-7 16-2.2-6.4L4 11.5z"/></svg>
        <span style="font-size: 11.5px; font-weight: 700;">Nudge</span>
      </div>
      <div style="height: 66px; border-radius: 20px; background: rgba(255,255,255,.58); border: 0.5px solid rgba(255,255,255,.75); box-shadow: inset 0 1px 0.5px rgba(255,255,255,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16211E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 10-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
        <span style="font-size: 11.5px; font-weight: 700;">Map</span>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 22px; top: 552px; font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #9AA5A0;">Plan together</div>

  <div style="position: absolute; left: 14px; top: 578px; width: 362px; display: flex; flex-direction: column; gap: 10px;">

    <div style="display: flex; align-items: center; gap: 13px; border-radius: 24px; padding: 13px; background: rgba(255,255,255,.72); border: 0.5px solid rgba(255,255,255,.85); box-shadow: inset 0 1px 0.5px rgba(255,255,255,.9), 0 6px 18px rgba(16,34,30,.07);">
      <div style="width: 42px; height: 42px; border-radius: 14px; background: rgba(14,122,112,.12); display: flex; align-items: center; justify-content: center; flex: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E7A70" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7.5" width="17" height="13" rx="3"/><path d="M9 7.5V5.5a1.5 1.5 0 011.5-1.5h3A1.5 1.5 0 0115 5.5v2"/></svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 15.5px; font-weight: 700;">Packing</div>
        <div style="font-size: 12.5px; color: #5E6D68; margin-top: 3px;">18 of 29 packed &middot; 4 left for you</div>
      </div>
      <svg width="40" height="40" viewBox="0 0 40 40" style="flex: none;" aria-hidden="true">
        <circle cx="20" cy="20" r="16" fill="none" stroke="rgba(22,33,30,.10)" stroke-width="4"/>
        <circle cx="20" cy="20" r="16" fill="none" stroke="#0E7A70" stroke-width="4" stroke-linecap="round" stroke-dasharray="62.3 100.5" transform="rotate(-90 20 20)"/>
        <text x="20" y="24" text-anchor="middle" font-family="Manrope, sans-serif" font-size="11" font-weight="800" fill="#16211E">62</text>
      </svg>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; border-radius: 24px; padding: 13px; background: rgba(255,255,255,.72); border: 0.5px solid rgba(255,255,255,.85); box-shadow: inset 0 1px 0.5px rgba(255,255,255,.9), 0 6px 18px rgba(16,34,30,.07);">
      <div style="width: 42px; height: 42px; border-radius: 14px; background: rgba(212,92,54,.13); display: flex; align-items: center; justify-content: center; flex: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C0532F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7.5l2 2 3.5-3.5"/><path d="M4.5 16.5l2 2 3.5-3.5"/><path d="M13 8h7M13 17h7"/></svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 15.5px; font-weight: 700;">To-do</div>
        <div style="font-size: 12.5px; color: #5E6D68; margin-top: 3px;">Next: book airport transfer &middot; Sam</div>
      </div>
      <svg width="40" height="40" viewBox="0 0 40 40" style="flex: none;" aria-hidden="true">
        <circle cx="20" cy="20" r="16" fill="none" stroke="rgba(22,33,30,.10)" stroke-width="4"/>
        <circle cx="20" cy="20" r="16" fill="none" stroke="#D45C36" stroke-width="4" stroke-linecap="round" stroke-dasharray="44.7 100.5" transform="rotate(-90 20 20)"/>
        <text x="20" y="24" text-anchor="middle" font-family="Manrope, sans-serif" font-size="10" font-weight="800" fill="#16211E">4/9</text>
      </svg>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; border-radius: 24px; padding: 13px; background: rgba(255,255,255,.72); border: 0.5px solid rgba(255,255,255,.85); box-shadow: inset 0 1px 0.5px rgba(255,255,255,.9), 0 6px 18px rgba(16,34,30,.07);">
      <div style="width: 42px; height: 42px; border-radius: 14px; background: rgba(224,163,60,.16); display: flex; align-items: center; justify-content: center; flex: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9741C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5v8a2.5 2.5 0 005 0v-8"/><path d="M9.5 11.5v9"/><path d="M17 3.5c-1.7 1.3-2.5 3.2-2.5 5.5 0 1.7.8 2.8 2.5 3v8.5"/></svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 15.5px; font-weight: 700;">Food &amp; places</div>
        <div style="font-size: 12.5px; color: #5E6D68; margin-top: 3px;">6 saved &middot; 2 booked &middot; 1 needs a vote</div>
      </div>
      <div style="flex: none; min-width: 28px; height: 28px; padding: 0 9px; border-radius: 999px; background: #D45C36; color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0.5px rgba(255,255,255,.4);">1</div>
    </div>

  </div>

  <div style="position: absolute; left: 76px; bottom: 28px; width: 238px; height: 58px; border-radius: 999px; padding: 6px; display: flex; align-items: center; gap: 8px; background: linear-gradient(150deg, rgba(255,255,255,.62), rgba(255,255,255,.38)); backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%); border: 0.5px solid rgba(255,255,255,.8); box-shadow: inset 0 1px 0.5px rgba(255,255,255,.95), inset 0 -0.5px 0 rgba(255,255,255,.45), 0 16px 40px rgba(16,34,30,.22), 0 3px 8px rgba(16,34,30,.10);">
    <div style="flex: 1; height: 46px; border-radius: 999px; background: linear-gradient(160deg, #1E2A26, #0E1815); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14.5px; font-weight: 700; color: #FFFFFF; box-shadow: inset 0 1px 0.5px rgba(255,255,255,.28);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add
    </div>
    <div style="width: 46px; height: 46px; border-radius: 999px; background: rgba(255,255,255,.5); border: 0.5px solid rgba(255,255,255,.72); box-shadow: inset 0 1px 0.5px rgba(255,255,255,.9); display: flex; align-items: center; justify-content: center; color: #16211E; flex: none;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20v-1.6a3.4 3.4 0 00-3.4-3.4H8.4A3.4 3.4 0 005 18.4V20"/><circle cx="12.5" cy="8" r="3.6"/></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
