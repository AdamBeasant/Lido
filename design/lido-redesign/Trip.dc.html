<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #0E7A70; text-decoration: none; }
    a:hover { color: #0A5A53; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(180deg, #F7E7D2 0%, #F6F2EA 32%, #F6F2EA 100%); font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif; color: #16211E; -webkit-font-smoothing: antialiased;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 0 20px;">
    <div style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,.78); display: flex; align-items: center; justify-content: center; color: #16211E;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
    </div>
    <div style="display: flex; gap: 8px;">
      <div style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,.78); display: flex; align-items: center; justify-content: center; color: #16211E;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8.5 7.5L12 4l3.5 3.5"/><path d="M5 14v4.5a1.5 1.5 0 001.5 1.5h11a1.5 1.5 0 001.5-1.5V14"/></svg>
      </div>
      <div style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,.78); display: flex; align-items: center; justify-content: center; color: #16211E;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg>
      </div>
    </div>
  </div>

  <div style="position: relative; margin: 8px 20px 0 20px; border-radius: 24px; overflow: hidden; box-shadow: 0 2px 4px rgba(22,33,30,.06), 0 18px 40px rgba(22,33,30,.10);">
    <svg viewBox="0 0 350 190" width="350" height="190" style="display: block;" aria-hidden="true">
      <defs>
        <clipPath id="tCover"><rect width="350" height="190"/></clipPath>
        <linearGradient id="tSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F8E0B6"/>
          <stop offset="1" stop-color="#F0B78D"/>
        </linearGradient>
        <linearGradient id="tScrim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0B2320" stop-opacity="0"/>
          <stop offset="1" stop-color="#0B2320" stop-opacity="0.42"/>
        </linearGradient>
      </defs>
      <g clip-path="url(#tCover)">
        <rect width="350" height="190" fill="url(#tSky)"/>
        <circle cx="250" cy="64" r="36" fill="#E1633C" opacity="0.92"/>
        <path d="M0 130 C 62 112, 98 142, 152 133 C 212 124, 252 146, 350 128 L350 190 L0 190 Z" fill="#0E7A70"/>
        <path d="M0 146 C 40 122, 76 108, 120 126 C 152 139, 170 168, 182 190 L0 190 Z" fill="#0B564F"/>
        <path d="M350 118 C 302 112, 270 136, 242 156 C 226 167, 216 179, 210 190 L350 190 Z" fill="#123C3A" opacity="0.94"/>
        <rect y="110" width="350" height="80" fill="url(#tScrim)"/>
      </g>
    </svg>
    <div style="position: absolute; top: 14px; right: 14px; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(20,30,27,.42); color: #FFFFFF; font-size: 12.5px; font-weight: 600;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
      In 12 days
    </div>
    <div style="position: absolute; left: 14px; bottom: 14px; display: flex; align-items: center; gap: 9px;">
      <div style="display: flex;">
        <div style="width: 28px; height: 28px; border-radius: 999px; background: #E2EDE9; border: 2px solid rgba(255,255,255,.9); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0E7A70;">A</div>
        <div style="width: 28px; height: 28px; border-radius: 999px; background: #F7DFD5; border: 2px solid rgba(255,255,255,.9); margin-left: -9px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #C0532F;">S</div>
        <div style="width: 28px; height: 28px; border-radius: 999px; background: #F3E4C6; border: 2px solid rgba(255,255,255,.9); margin-left: -9px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #A9741C;">J</div>
        <div style="width: 28px; height: 28px; border-radius: 999px; background: #DCE6E3; border: 2px solid rgba(255,255,255,.9); margin-left: -9px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #52635E;">+1</div>
      </div>
      <span style="font-size: 12.5px; font-weight: 600; color: #FFFFFF;">4 going</span>
    </div>
  </div>

  <div style="padding: 0 20px;">
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 32px; line-height: 1.08; margin-top: 16px;">Amalfi Coast</div>
    <div style="font-size: 13px; color: #6E7C76; margin-top: 6px;">Positano, Italy</div>

    <div style="display: flex; align-items: center; gap: 10px; margin-top: 12px;">
      <div style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(22,33,30,.05);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E7A70" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
        <span style="font-size: 12.5px; font-weight: 600;">24 &ndash; 31 Aug</span>
        <span style="font-size: 12.5px; color: #96A29C;">7 nights</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(22,33,30,.05);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#E0A33C" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
        <span style="font-size: 12.5px; font-weight: 600;">28&deg;</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 18px;">
      <div style="height: 68px; border-radius: 18px; background: #16211E; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8.5" r="3.6"/><path d="M4 19.5c0-3.2 2.7-5.2 6-5.2 1.3 0 2.5.3 3.5.9"/><path d="M18 14v6M15 17h6"/></svg>
        <span style="font-size: 11.5px; font-weight: 600;">Invite</span>
      </div>
      <div style="height: 68px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(22,33,30,.05); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16211E" stroke-width="1.8" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
        <span style="font-size: 11.5px; font-weight: 600;">Add</span>
      </div>
      <div style="height: 68px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(22,33,30,.05); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16211E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L20 4l-7 16-2.2-6.4L4 11.5z"/></svg>
        <span style="font-size: 11.5px; font-weight: 600;">Nudge</span>
      </div>
      <div style="height: 68px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(22,33,30,.05); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16211E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12.5V19a1.5 1.5 0 001.5 1.5h8a1.5 1.5 0 001.5-1.5v-6.5"/><path d="M12 3.5v11"/><path d="M8.5 7L12 3.5 15.5 7"/></svg>
        <span style="font-size: 11.5px; font-weight: 600;">Share</span>
      </div>
    </div>

    <div style="margin-top: 22px; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #A0AAA4;">Plan together</div>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px;">

      <div style="display: flex; align-items: center; gap: 13px; background: #FFFFFF; border-radius: 20px; padding: 14px; box-shadow: 0 1px 2px rgba(22,33,30,.05);">
        <div style="width: 40px; height: 40px; border-radius: 13px; background: #E2EDE9; display: flex; align-items: center; justify-content: center; flex: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E7A70" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7.5" width="17" height="13" rx="3"/><path d="M9 7.5V5.5a1.5 1.5 0 011.5-1.5h3A1.5 1.5 0 0115 5.5v2"/></svg>
        </div>
        <div style="flex: 1; min-width: 0;">
          <div style="font-size: 15px; font-weight: 700;">Packing</div>
          <div style="font-size: 12.5px; color: #6E7C76; margin-top: 3px;">18 of 29 packed &middot; 4 left for you</div>
        </div>
        <svg width="38" height="38" viewBox="0 0 38 38" style="flex: none;" aria-hidden="true">
          <circle cx="19" cy="19" r="15.5" fill="none" stroke="#EBE4D8" stroke-width="4"/>
          <circle cx="19" cy="19" r="15.5" fill="none" stroke="#0E7A70" stroke-width="4" stroke-linecap="round" stroke-dasharray="60.4 97.4" transform="rotate(-90 19 19)"/>
          <text x="19" y="22.5" text-anchor="middle" font-family="Manrope, sans-serif" font-size="11" font-weight="700" fill="#16211E">62</text>
        </svg>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; background: #FFFFFF; border-radius: 20px; padding: 14px; box-shadow: 0 1px 2px rgba(22,33,30,.05);">
        <div style="width: 40px; height: 40px; border-radius: 13px; background: #F7DFD5; display: flex; align-items: center; justify-content: center; flex: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C0532F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7.5l2 2 3.5-3.5"/><path d="M4.5 16.5l2 2 3.5-3.5"/><path d="M13 8h7M13 17h7"/></svg>
        </div>
        <div style="flex: 1; min-width: 0;">
          <div style="font-size: 15px; font-weight: 700;">To-do</div>
          <div style="font-size: 12.5px; color: #6E7C76; margin-top: 3px;">Next: book airport transfer &middot; Sam</div>
        </div>
        <svg width="38" height="38" viewBox="0 0 38 38" style="flex: none;" aria-hidden="true">
          <circle cx="19" cy="19" r="15.5" fill="none" stroke="#EBE4D8" stroke-width="4"/>
          <circle cx="19" cy="19" r="15.5" fill="none" stroke="#D45C36" stroke-width="4" stroke-linecap="round" stroke-dasharray="43.3 97.4" transform="rotate(-90 19 19)"/>
          <text x="19" y="22.5" text-anchor="middle" font-family="Manrope, sans-serif" font-size="11" font-weight="700" fill="#16211E">4/9</text>
        </svg>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; background: #FFFFFF; border-radius: 20px; padding: 14px; box-shadow: 0 1px 2px rgba(22,33,30,.05);">
        <div style="width: 40px; height: 40px; border-radius: 13px; background: #F3E4C6; display: flex; align-items: center; justify-content: center; flex: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9741C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5v8a2.5 2.5 0 005 0v-8"/><path d="M9.5 11.5v9"/><path d="M17 3.5c-1.7 1.3-2.5 3.2-2.5 5.5 0 1.7.8 2.8 2.5 3v8.5"/></svg>
        </div>
        <div style="flex: 1; min-width: 0;">
          <div style="font-size: 15px; font-weight: 700;">Food &amp; places</div>
          <div style="font-size: 12.5px; color: #6E7C76; margin-top: 3px;">6 saved &middot; 2 booked &middot; 1 needs a vote</div>
        </div>
        <div style="flex: none; height: 26px; padding: 0 10px; border-radius: 999px; background: #F1EADD; color: #6E7C76; font-size: 12px; font-weight: 700; display: flex; align-items: center;">6</div>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
