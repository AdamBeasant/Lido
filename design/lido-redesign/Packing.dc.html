<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #0E7A70; text-decoration: none; }
    a:hover { color: #0A5A53; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6F2EA; font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif; color: #16211E; -webkit-font-smoothing: antialiased;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 0 20px;">
    <div style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(22,33,30,.05);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16211E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
    </div>
    <div style="font-size: 15px; font-weight: 700;">Packing</div>
    <div style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(22,33,30,.05);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16211E" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 14px; margin: 16px 20px 0 20px; background: #FFFFFF; border-radius: 22px; padding: 16px; box-shadow: 0 1px 2px rgba(22,33,30,.05);">
    <div style="flex: 1; min-width: 0;">
      <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; line-height: 1.05;">18 of 29 packed</div>
      <div style="font-size: 12.5px; color: #6E7C76; margin-top: 5px;">4 items left for you &middot; 7 for Sam</div>
    </div>
    <svg width="52" height="52" viewBox="0 0 52 52" style="flex: none;" aria-hidden="true">
      <circle cx="26" cy="26" r="21" fill="none" stroke="#EFE9DD" stroke-width="5"/>
      <circle cx="26" cy="26" r="21" fill="none" stroke="#0E7A70" stroke-width="5" stroke-linecap="round" stroke-dasharray="81.8 131.9" transform="rotate(-90 26 26)"/>
      <text x="26" y="30" text-anchor="middle" font-family="Manrope, sans-serif" font-size="13" font-weight="700" fill="#16211E">62%</text>
    </svg>
  </div>

  <div style="display: flex; gap: 8px; margin: 14px 20px 0 20px;">
    <div style="height: 34px; padding: 0 14px; border-radius: 999px; background: #16211E; color: #FFFFFF; font-size: 12.5px; font-weight: 600; display: flex; align-items: center;">Everyone</div>
    <div style="height: 34px; padding: 0 12px 0 5px; border-radius: 999px; background: #FFFFFF; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; box-shadow: 0 1px 2px rgba(22,33,30,.05);">
      <span style="width: 24px; height: 24px; border-radius: 999px; background: #E2EDE9; color: #0E7A70; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;">A</span>
      Adam
    </div>
    <div style="height: 34px; padding: 0 12px 0 5px; border-radius: 999px; background: #FFFFFF; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; box-shadow: 0 1px 2px rgba(22,33,30,.05);">
      <span style="width: 24px; height: 24px; border-radius: 999px; background: #F7DFD5; color: #C0532F; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;">S</span>
      Sam
    </div>
    <div style="height: 34px; width: 34px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(22,33,30,.05); color: #6E7C76;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
    </div>
  </div>

  <div style="margin: 20px 20px 0 20px;">

    <div style="display: flex; align-items: center; gap: 8px; padding: 0 2px 9px 2px;">
      <span style="font-size: 12.5px; font-weight: 700; letter-spacing: .04em;">Documents</span>
      <span style="font-size: 12px; font-weight: 600; color: #0E7A70;">4/4</span>
      <span style="flex: 1; height: 1px; background: #E9E2D5;"></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A0AAA4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14.5L12 9l6 5.5"/></svg>
    </div>
    <div style="background: #FFFFFF; border-radius: 18px; padding: 4px 14px; box-shadow: 0 1px 2px rgba(22,33,30,.05);">
      <div style="display: flex; align-items: center; gap: 12px; height: 44px;">
        <svg width="22" height="22" viewBox="0 0 24 24" style="flex: none;"><circle cx="12" cy="12" r="10" fill="#0E7A70"/><path d="M7.6 12.2l2.9 2.9 5.9-6" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="flex: 1; font-size: 14.5px; color: #A0AAA4; text-decoration: line-through;">Passports</span>
        <span style="width: 24px; height: 24px; border-radius: 999px; background: #E2EDE9; color: #0E7A70; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none;">A</span>
      </div>
      <div style="height: 1px; background: #F2ECE1;"></div>
      <div style="display: flex; align-items: center; gap: 12px; height: 44px;">
        <svg width="22" height="22" viewBox="0 0 24 24" style="flex: none;"><circle cx="12" cy="12" r="10" fill="#0E7A70"/><path d="M7.6 12.2l2.9 2.9 5.9-6" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="flex: 1; font-size: 14.5px; color: #A0AAA4; text-decoration: line-through;">Travel insurance</span>
        <span style="width: 24px; height: 24px; border-radius: 999px; background: #F7DFD5; color: #C0532F; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none;">S</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 18px 2px 9px 2px;">
      <span style="font-size: 12.5px; font-weight: 700; letter-spacing: .04em;">Clothes</span>
      <span style="font-size: 12px; font-weight: 600; color: #96A29C;">6/11</span>
      <span style="flex: 1; height: 1px; background: #E9E2D5;"></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A0AAA4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14.5L12 9l6 5.5"/></svg>
    </div>
    <div style="background: #FFFFFF; border-radius: 18px; padding: 4px 14px; box-shadow: 0 1px 2px rgba(22,33,30,.05);">
      <div style="display: flex; align-items: center; gap: 12px; height: 44px;">
        <svg width="22" height="22" viewBox="0 0 24 24" style="flex: none;"><circle cx="12" cy="12" r="9.4" fill="none" stroke="#D8D2C5" stroke-width="1.8"/></svg>
        <span style="flex: 1; font-size: 14.5px;">Swimwear</span>
        <span style="width: 24px; height: 24px; border-radius: 999px; background: #E2EDE9; color: #0E7A70; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none;">A</span>
      </div>
      <div style="height: 1px; background: #F2ECE1;"></div>
      <div style="display: flex; align-items: center; gap: 12px; height: 44px;">
        <svg width="22" height="22" viewBox="0 0 24 24" style="flex: none;"><circle cx="12" cy="12" r="9.4" fill="none" stroke="#D8D2C5" stroke-width="1.8"/></svg>
        <span style="flex: 1; font-size: 14.5px;">Linen shirt</span>
        <span style="width: 24px; height: 24px; border-radius: 999px; background: #F3E4C6; color: #A9741C; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none;">J</span>
      </div>
      <div style="height: 1px; background: #F2ECE1;"></div>
      <div style="display: flex; align-items: center; gap: 12px; height: 44px;">
        <svg width="22" height="22" viewBox="0 0 24 24" style="flex: none;"><circle cx="12" cy="12" r="10" fill="#0E7A70"/><path d="M7.6 12.2l2.9 2.9 5.9-6" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="flex: 1; font-size: 14.5px; color: #A0AAA4; text-decoration: line-through;">Walking shoes</span>
        <span style="width: 24px; height: 24px; border-radius: 999px; background: #E2EDE9; color: #0E7A70; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none;">A</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 18px 2px 9px 2px;">
      <span style="font-size: 12.5px; font-weight: 700; letter-spacing: .04em;">Toiletries</span>
      <span style="font-size: 12px; font-weight: 600; color: #96A29C;">2/5</span>
      <span style="flex: 1; height: 1px; background: #E9E2D5;"></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A0AAA4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14.5L12 9l6 5.5"/></svg>
    </div>
    <div style="background: #FFFFFF; border-radius: 18px; padding: 4px 14px; box-shadow: 0 1px 2px rgba(22,33,30,.05);">
      <div style="display: flex; align-items: center; gap: 12px; height: 44px;">
        <svg width="22" height="22" viewBox="0 0 24 24" style="flex: none;"><circle cx="12" cy="12" r="9.4" fill="none" stroke="#D8D2C5" stroke-width="1.8"/></svg>
        <span style="flex: 1; font-size: 14.5px;">Factor 50 sunscreen</span>
        <span style="width: 24px; height: 24px; border-radius: 999px; background: #F7DFD5; color: #C0532F; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none;">S</span>
      </div>
    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 168px; background: linear-gradient(to bottom, rgba(246,242,234,0), #F6F2EA 46%);"></div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px;">
    <div style="display: flex; gap: 8px; padding: 0 4px 10px 4px;">
      <div style="height: 34px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(22,33,30,.06); display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0E7A70" stroke-width="2.2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
        Power adapter
      </div>
      <div style="height: 34px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(22,33,30,.06); display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0E7A70" stroke-width="2.2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
        Beach towel
      </div>
      <div style="height: 34px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(22,33,30,.06); display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0E7A70" stroke-width="2.2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
        Book
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 8px 0 8px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(22,33,30,.07), 0 14px 30px rgba(22,33,30,.10);">
      <div style="width: 40px; height: 40px; border-radius: 999px; background: #F4EFE4; display: flex; align-items: center; justify-content: center; flex: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16211E" stroke-width="2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
      </div>
      <span style="flex: 1; font-size: 15px; color: #96A29C;">Add to packing&hellip;</span>
      <div style="width: 40px; height: 40px; border-radius: 999px; background: #16211E; display: flex; align-items: center; justify-content: center; flex: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6"/><path d="M6.5 11.5L12 6l5.5 5.5"/></svg>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
