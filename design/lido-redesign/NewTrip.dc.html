<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #0E7A70; text-decoration: none; }
    a:hover { color: #0A5A53; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; font-family: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #101413; -webkit-font-smoothing: antialiased;">

    <img src="amalfi.jpg" alt="" style="position: absolute; left: -70px; top: -90px; width: 530px; height: 560px; object-fit: cover; object-position: 50% 45%; filter: blur(46px) saturate(150%);">
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 470px; background: linear-gradient(180deg, rgba(12,22,20,.3), rgba(12,22,20,.14));"></div>

  <div style="position: absolute; left: 16px; top: 46px; display: flex; align-items: center; justify-content: space-between; width: 358px;">
    <div style="width: 40px; height: 40px; border-radius: 999px; background: rgba(255,255,255,.26); backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%); border: 0.5px solid rgba(255,255,255,.44); box-shadow: inset 0 1px 0.5px rgba(255,255,255,.6); display: flex; align-items: center; justify-content: center; color: #FFFFFF;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
    <div style="font-size: 14.5px; font-weight: 500; color: rgba(255,255,255,.95);">New trip</div>
    <div style="width: 40px;"></div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 108px; bottom: 0; border-radius: 42px 42px 0 0; padding: 0 20px; background: linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.96) 34%, #FFFFFF 62%); backdrop-filter: blur(48px) saturate(190%); -webkit-backdrop-filter: blur(48px) saturate(190%); box-shadow: inset 0 1px 0.5px rgba(255,255,255,1), 0 -18px 50px rgba(12,22,20,.2);">

    <div style="display: flex; justify-content: center; padding-top: 10px;">
      <div style="width: 38px; height: 5px; border-radius: 999px; background: rgba(16,20,19,.14);"></div>
    </div>

    <div style="font-family: 'Newsreader', 'Iowan Old Style', Georgia, serif; font-weight: 300; font-size: 38px; line-height: 1.05; letter-spacing: -.015em; margin-top: 18px;">Where are we going?</div>
    <div style="font-size: 13px; color: #6B7671; margin-top: 9px; max-width: 310px; line-height: 1.55;">Pick a place and Lido fills in the dates, the cover and a starter packing list.</div>

    <div style="display: flex; align-items: center; gap: 13px; height: 66px; padding: 0 13px; border-radius: 22px; margin-top: 20px; background: #FFFFFF; box-shadow: 0 0 0 1.5px #0E7A70, 0 6px 18px rgba(14,122,112,.12);">
      <div style="width: 42px; height: 42px; border-radius: 14px; overflow: hidden; flex: none;">
        <img src="amalfi.jpg" alt="Positano" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 46%; display: block;">
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 16px; font-weight: 600; letter-spacing: -.012em;">Positano</div>
        <div style="font-size: 12px; color: #9AA39E; margin-top: 3px;">Campania, Italy</div>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" style="flex: none;"><circle cx="12" cy="12" r="10" fill="#0E7A70"/><path d="M7.6 12.2l2.9 2.9 5.9-6" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div style="display: flex; gap: 8px; margin-top: 12px;">
      <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(16,20,19,.045); color: #6B7671; font-size: 13px; font-weight: 500; display: flex; align-items: center;">Lisbon</div>
      <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(16,20,19,.045); color: #6B7671; font-size: 13px; font-weight: 500; display: flex; align-items: center;">Chamonix</div>
      <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(16,20,19,.045); color: #6B7671; font-size: 13px; font-weight: 500; display: flex; align-items: center;">Copenhagen</div>
    </div>

    <div style="margin-top: 24px; font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: #9AA39E;">When</div>
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 11px;">
      <div style="flex: 1; height: 68px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 0 0 0.5px rgba(16,20,19,.07), 0 4px 14px rgba(16,20,19,.04); padding: 12px 15px;">
        <div style="font-size: 10.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: #9AA39E;">Leave</div>
        <div style="font-size: 18px; font-weight: 600; margin-top: 6px; letter-spacing: -.018em;">Sun 24 Aug</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B4BCB8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M4 12h15"/><path d="M14 7l5 5-5 5"/></svg>
      <div style="flex: 1; height: 68px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 0 0 0.5px rgba(16,20,19,.07), 0 4px 14px rgba(16,20,19,.04); padding: 12px 15px;">
        <div style="font-size: 10.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: #9AA39E;">Return</div>
        <div style="font-size: 18px; font-weight: 600; margin-top: 6px; letter-spacing: -.018em;">Sun 31 Aug</div>
      </div>
    </div>

    <div style="margin-top: 24px; font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: #9AA39E;">Cover</div>
    <div style="display: flex; gap: 10px; margin-top: 11px;">
      <div style="width: 74px; height: 62px; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 2.5px #0E7A70, 0 0 0 5px #FFFFFF;">
        <img src="amalfi.jpg" alt="Positano" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 46%; display: block;">
      </div>
      <div style="width: 74px; height: 62px; border-radius: 18px; overflow: hidden;">
        <svg viewBox="0 0 74 62" width="74" height="62" style="display: block;" aria-hidden="true">
          <rect width="74" height="62" fill="#EFE3EF"/>
          <circle cx="22" cy="20" r="11" fill="#DD6E42"/>
          <path d="M0 40 L20 26 L37 42 L53 30 L74 44 L74 62 L0 62 Z" fill="#87789E"/>
          <rect y="50" width="74" height="12" fill="#433A5E"/>
        </svg>
      </div>
      <div style="width: 74px; height: 62px; border-radius: 18px; overflow: hidden;">
        <svg viewBox="0 0 74 62" width="74" height="62" style="display: block;" aria-hidden="true">
          <rect width="74" height="62" fill="#E1EBE8"/>
          <circle cx="23" cy="17" r="10" fill="#E5A63F"/>
          <path d="M0 48 L21 22 L39 48 Z" fill="#8AA09B"/>
          <path d="M29 50 L49 20 L74 50 Z" fill="#33534F"/>
          <rect y="48" width="74" height="14" fill="#15423F"/>
        </svg>
      </div>
      <div style="flex: 1; height: 62px; border-radius: 18px; border: 1.5px dashed rgba(16,20,19,.16); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA39E;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="3"/><circle cx="9" cy="10.5" r="1.8"/><path d="M4 16l5-4.5 4.5 4 3-2.5 4 3.5"/></svg>
        <span style="font-size: 11px; font-weight: 500;">Photo</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; margin-top: 22px; border-radius: 22px; padding: 14px; background: #FFFFFF; box-shadow: 0 0 0 0.5px rgba(16,20,19,.07), 0 4px 14px rgba(16,20,19,.04);">
      <div style="width: 42px; height: 42px; border-radius: 14px; background: rgba(14,122,112,.1); display: flex; align-items: center; justify-content: center; flex: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E7A70" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7.5" width="17" height="13" rx="3"/><path d="M9 7.5V5.5a1.5 1.5 0 011.5-1.5h3A1.5 1.5 0 0115 5.5v2"/></svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 15px; font-weight: 600; letter-spacing: -.012em;">Start a beach packing list</div>
        <div style="font-size: 12px; color: #6B7671; margin-top: 4px;">21 items across 6 categories</div>
      </div>
      <div style="width: 52px; height: 31px; border-radius: 999px; background: linear-gradient(160deg, #159086, #0B5F57); padding: 3px; display: flex; justify-content: flex-end; flex: none; box-shadow: inset 0 1px 0.5px rgba(255,255,255,.32);">
        <div style="width: 25px; height: 25px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.18);"></div>
      </div>
    </div>

  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; align-items: center; gap: 9px; height: 64px; padding: 7px; border-radius: 999px; background: linear-gradient(150deg, rgba(255,255,255,.86), rgba(255,255,255,.66)); backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%); box-shadow: inset 0 1px 0.5px rgba(255,255,255,1), 0 0 0 0.5px rgba(16,20,19,.05), 0 16px 40px rgba(16,20,19,.14);">
    <div style="width: 50px; height: 50px; border-radius: 999px; background: rgba(255,255,255,.72); box-shadow: inset 0 1px 0.5px rgba(255,255,255,1), 0 0 0 0.5px rgba(16,20,19,.05); display: flex; align-items: center; justify-content: center; color: #101413; flex: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8.5" r="3.6"/><path d="M4 19.5c0-3.2 2.7-5.2 6-5.2 1.3 0 2.5.3 3.5.9"/><path d="M18 14v6M15 17h6"/></svg>
    </div>
    <div style="flex: 1; height: 50px; border-radius: 999px; background: linear-gradient(160deg, #159086, #0B5F57); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 600; letter-spacing: -.012em; box-shadow: inset 0 1px 0.5px rgba(255,255,255,.4), 0 4px 14px rgba(11,95,87,.3);">Create trip</div>
  </div>

</div>
