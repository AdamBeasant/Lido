<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #0E7A70; text-decoration: none; }
    a:hover { color: #0A5A53; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6F2EA; font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif; color: #16211E; -webkit-font-smoothing: antialiased;">

  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 56px 20px 0 20px;">
    <div>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #A0AAA4;">Lido</div>
      <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; line-height: 1.05; margin-top: 7px;">Two trips ahead</div>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 999px; background: #E2EDE9; border: 1px solid #CFE0DA; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #0E7A70; flex: none;">A</div>
  </div>

  <div style="display: flex; gap: 4px; margin: 18px 20px 0 20px; padding: 4px; background: #EBE4D8; border-radius: 999px;">
    <div style="flex: 1; height: 40px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(22,33,30,.07); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">Upcoming</div>
    <div style="flex: 1; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #7D8B85;">Past</div>
  </div>

  <div style="margin: 18px 20px 0 20px; background: #FFFFFF; border-radius: 26px; overflow: hidden; box-shadow: 0 1px 2px rgba(22,33,30,.05), 0 14px 34px rgba(22,33,30,.07);">
    <div style="position: relative; height: 168px;">
      <svg viewBox="0 0 350 168" width="350" height="168" style="display: block;" aria-hidden="true">
        <defs>
          <clipPath id="mCover"><rect width="350" height="168"/></clipPath>
          <linearGradient id="mSky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F8E0B6"/>
            <stop offset="1" stop-color="#F0B78D"/>
          </linearGradient>
        </defs>
        <g clip-path="url(#mCover)">
          <rect width="350" height="168" fill="url(#mSky)"/>
          <circle cx="252" cy="58" r="33" fill="#E1633C" opacity="0.92"/>
          <path d="M0 116 C 62 99, 98 127, 152 119 C 212 110, 252 131, 350 114 L350 168 L0 168 Z" fill="#0E7A70"/>
          <path d="M0 130 C 40 108, 76 95, 120 112 C 152 124, 170 149, 182 168 L0 168 Z" fill="#0B564F"/>
          <path d="M350 104 C 302 99, 270 121, 242 139 C 226 149, 216 159, 210 168 L350 168 Z" fill="#123C3A" opacity="0.94"/>
        </g>
      </svg>
      <div style="position: absolute; top: 14px; right: 14px; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(20,30,27,.42); color: #FFFFFF; font-size: 12.5px; font-weight: 600; letter-spacing: .01em;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
        12 days
      </div>
    </div>

    <div style="padding: 15px 16px 16px 16px;">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
        <div style="min-width: 0;">
          <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; line-height: 1.1;">Amalfi Coast</div>
          <div style="font-size: 12.5px; color: #6E7C76; margin-top: 5px;">Positano, Italy &middot; 24&ndash;31 Aug &middot; 7 nights</div>
        </div>
        <div style="display: flex; flex: none; padding-top: 3px;">
          <div style="width: 27px; height: 27px; border-radius: 999px; background: #E2EDE9; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0E7A70;">A</div>
          <div style="width: 27px; height: 27px; border-radius: 999px; background: #F7DFD5; border: 2px solid #FFFFFF; margin-left: -8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #C0532F;">S</div>
          <div style="width: 27px; height: 27px; border-radius: 999px; background: #F3E4C6; border: 2px solid #FFFFFF; margin-left: -8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #A9741C;">J</div>
          <div style="width: 27px; height: 27px; border-radius: 999px; background: #EBE4D8; border: 2px solid #FFFFFF; margin-left: -8px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #6E7C76;">+1</div>
        </div>
      </div>

      <div style="height: 1px; background: #EEE8DC; margin: 14px 0 12px 0;"></div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
        <div>
          <div style="font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #A0AAA4;">Packing</div>
          <div style="font-size: 15px; font-weight: 700; margin-top: 4px;">18<span style="color: #A0AAA4; font-weight: 600;">/29</span></div>
          <div style="height: 4px; border-radius: 999px; background: #EBE4D8; margin-top: 7px;"><div style="width: 62%; height: 4px; border-radius: 999px; background: #0E7A70;"></div></div>
        </div>
        <div>
          <div style="font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #A0AAA4;">To-do</div>
          <div style="font-size: 15px; font-weight: 700; margin-top: 4px;">4<span style="color: #A0AAA4; font-weight: 600;">/9</span></div>
          <div style="height: 4px; border-radius: 999px; background: #EBE4D8; margin-top: 7px;"><div style="width: 44%; height: 4px; border-radius: 999px; background: #D45C36;"></div></div>
        </div>
        <div>
          <div style="font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #A0AAA4;">Booked</div>
          <div style="font-size: 15px; font-weight: 700; margin-top: 4px;">2<span style="color: #A0AAA4; font-weight: 600;">/6</span></div>
          <div style="height: 4px; border-radius: 999px; background: #EBE4D8; margin-top: 7px;"><div style="width: 33%; height: 4px; border-radius: 999px; background: #E0A33C;"></div></div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 7px; margin-top: 13px;">
        <span style="width: 6px; height: 6px; border-radius: 999px; background: #0E7A70; flex: none;"></span>
        <span style="font-size: 12px; color: #6E7C76;">Sam packed 3 things &middot; 2h ago</span>
      </div>
    </div>
  </div>

  <div style="margin: 22px 20px 0 20px; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #A0AAA4;">Later this year</div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin: 11px 20px 0 20px;">
    <div style="display: flex; align-items: center; gap: 13px; background: #FFFFFF; border-radius: 20px; padding: 10px; box-shadow: 0 1px 2px rgba(22,33,30,.05);">
      <div style="width: 58px; height: 58px; border-radius: 15px; overflow: hidden; flex: none;">
        <svg viewBox="0 0 58 58" width="58" height="58" style="display: block;" aria-hidden="true">
          <rect width="58" height="58" fill="#EFE2CB"/>
          <circle cx="41" cy="17" r="11" fill="#E0A33C"/>
          <path d="M0 40 L14 27 L26 40 L36 30 L58 46 L58 58 L0 58 Z" fill="#D45C36"/>
          <path d="M0 47 L18 36 L34 49 L58 38 L58 58 L0 58 Z" fill="#2E6E76"/>
        </svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 15px; font-weight: 700;">Lisbon long weekend</div>
        <div style="font-size: 12.5px; color: #6E7C76; margin-top: 3px;">Lisbon, Portugal &middot; 3&ndash;6 Oct</div>
      </div>
      <div style="flex: none; height: 26px; padding: 0 10px; border-radius: 999px; background: #F1EADD; color: #6E7C76; font-size: 12px; font-weight: 600; display: flex; align-items: center;">7w</div>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; background: #FFFFFF; border-radius: 20px; padding: 10px; box-shadow: 0 1px 2px rgba(22,33,30,.05);">
      <div style="width: 58px; height: 58px; border-radius: 15px; overflow: hidden; flex: none;">
        <svg viewBox="0 0 58 58" width="58" height="58" style="display: block;" aria-hidden="true">
          <rect width="58" height="58" fill="#DCE6E3"/>
          <circle cx="17" cy="16" r="9" fill="#E0A33C"/>
          <path d="M0 44 L16 22 L30 44 Z" fill="#7E948F"/>
          <path d="M22 46 L38 20 L58 46 Z" fill="#2E4B49"/>
          <rect y="44" width="58" height="14" fill="#123C3A"/>
        </svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 15px; font-weight: 700;">Chamonix, take two</div>
        <div style="font-size: 12.5px; color: #6E7C76; margin-top: 3px;">Chamonix, France &middot; 12&ndash;19 Dec</div>
      </div>
      <div style="flex: none; height: 26px; padding: 0 10px; border-radius: 999px; background: #F1EADD; color: #6E7C76; font-size: 12px; font-weight: 600; display: flex; align-items: center;">3mo</div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 128px; background: linear-gradient(to bottom, rgba(246,242,234,0), #F6F2EA 58%);"></div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 30px; display: flex; align-items: center; gap: 10px;">
    <div style="flex: 1; height: 54px; border-radius: 999px; background: #16211E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 15px; font-weight: 600; box-shadow: 0 8px 22px rgba(22,33,30,.22);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Plan a trip
    </div>
    <div style="width: 54px; height: 54px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 22px rgba(22,33,30,.12); color: #16211E; flex: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.4-4.4"/></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
